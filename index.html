<body>
  <header><a class="brand" href="./">마크다운 제거<span> / </span></a><a href="https://github.com/42inshin/removeMarkdown">GitHub ↗</a></header>
  <main>
    <h1>마크다운 제거</h1>
    <p class="intro">마크다운을 붙여넣으면 바로 변환됩니다.</p>
    <div class="workspace">
      <section class="panel"><div class="bar"><label for="source">마크다운</label><div><button id="example">예시</button><button id="clear">지우기</button></div></div><textarea id="source" placeholder="# 여기에 붙여넣기" spellcheck="false"></textarea></section>
      <section class="panel"><div class="bar"><h2>결과</h2><button id="copy" class="primary" disabled>복사</button></div><div id="result" class="result" role="region" aria-label="변환 결과" tabindex="0"><span class="placeholder">변환된 내용이 여기에 표시됩니다.</span></div></section>
    </div>
    <div class="below"><span>입력한 내용은 브라우저 안에서만 처리됩니다.</span><span id="status" role="status" aria-live="polite"></span></div>
    <details><summary>변환 방식</summary><p>제목과 강조 기호를 제거합니다. 목록의 -와 들여쓰기, 체크박스를 유지하고 *와 + 목록은 -로 바꿉니다. 링크와 이미지는 설명 (URL), 코드는 [언어]로 표시합니다. 표는 미리보기에서 테이블로, 일반 텍스트 복사에서는 탭으로 구분됩니다.</p></details>
    <aside id="ad-slot" class="ad-slot" aria-label="광고 영역" hidden></aside>
    <noscript>변환 기능을 사용하려면 JavaScript를 켜주세요.</noscript>
  </main>
  <footer><span>마크다운 제거</span><a href="./privacy.html">개인정보 처리 안내</a></footer>
</body></html>
